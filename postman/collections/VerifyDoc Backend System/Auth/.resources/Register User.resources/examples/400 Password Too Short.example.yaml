$kind: http-example
name: '400 Password Too Short'
order: 5000
request:
  url: '{{base_url}}/auth/register'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "firstName": "John",
        "lastName": "Doe",
        "email": "john.doe@example.com",
        "password": "pass",
        "role": "Citizen"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "status": "error",
        "message": "Password must be 8 or more than 8 character"
      }
