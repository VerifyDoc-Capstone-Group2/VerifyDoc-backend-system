name: Test fresh credential confirmation
on:
  push:
    branches: [feature/fresh-credential-confirmation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confirmation-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test confirmation service
        run: npx vitest run --config vitest.unit.config.js tests/credentials/freshConfirmation.unit.test.js
