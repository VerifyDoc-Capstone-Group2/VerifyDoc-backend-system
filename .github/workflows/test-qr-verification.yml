name: Test QR verification
on:
  push:
    branches: [feature/credentials]
    paths:
      - '.github/workflows/test-qr-verification.yml'
      - 'tests/credentials/qrVerification.test.js'
      - 'services/credentialVerificationService.js'
      - 'services/credentialQRCodeService.js'
      - 'controllers/credentialVerificationController.js'
      - 'routes/credentialVerificationRoute.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qr-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run QR verification tests
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          QR_VERIFICATION_SECRET: ${{ secrets.QR_VERIFICATION_SECRET }}
        run: npm test -- tests/credentials/qrVerification.test.js
