name: Test credential API routes
on:
  push:
    branches: [feature/credentials]
    paths:
      - '.github/workflows/test-credential-routes.yml'
      - 'tests/credentials/credentialRoutes.unit.test.js'
      - 'controllers/credentialController.js'
      - 'routes/credentialRoute.js'
      - 'app.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test credential controllers and routes
        run: npx vitest run --config vitest.unit.config.js tests/credentials/credentialRoutes.unit.test.js
