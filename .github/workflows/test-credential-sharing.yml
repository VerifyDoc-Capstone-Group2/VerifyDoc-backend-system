name: Test credential sharing
on:
  push:
    branches: [feature/credential-sharing]
    paths:
      - '.github/workflows/test-credential-sharing.yml'
      - 'tests/credentials/credentialShareService.unit.test.js'
      - 'services/credentialShareService.js'
      - 'models/credentialShareModel.js'
      - 'controllers/credentialShareController.js'
      - 'routes/credentialShareRoute.js'
      - 'app.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sharing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run credential sharing tests
        run: npx vitest run --config vitest.unit.config.js tests/credentials/credentialShareService.unit.test.js
